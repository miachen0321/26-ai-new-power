<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互動推論：Iris 與 AI4I 2020</title>
<style>
  body {
    max-width: 820px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
    font-family: "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei",
      "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.85;
    color: #222;
    background: #fff;
  }
  h1 { font-size: 1.55rem; color: #1f3d55; padding-bottom: 0.4rem; border-bottom: 1px solid #d7e1e8; }
  h2 { font-size: 1.22rem; color: #315b7d; margin-top: 2rem; }
  section, .result {
    border: 1px solid #d7e1e8;
    border-radius: 6px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
  }
  label { display: inline-block; width: 100%; font-size: 0.95rem; color: #333; }
  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 0.45rem 0.6rem;
    margin: 0.3rem 0 0.8rem;
    border: 1px solid #c6d2da;
    border-radius: 4px;
    font-size: 1rem;
  }
  button {
    background: #315b7d;
    color: #fff;
    border: 0;
    border-radius: 4px;
    padding: 0.5rem 1.4rem;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #244a69; }
  .result { display: none; }
  .result .pred { font-size: 1.3rem; font-weight: 700; color: #1f3d55; }
  .result table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  .result th, .result td { border: 1px solid #d7e1e8; padding: 0.4rem 0.6rem; text-align: left; }
  .result th { background: #edf3f7; color: #1f3d55; }
  .bar {
    background: #edf3f7;
    border-radius: 3px;
    height: 10px;
    width: 100%;
  }
  .bar > span {
    display: block;
    height: 10px;
    border-radius: 3px;
    background: #315b7d;
  }
  .muted { color: #666; font-size: 0.88rem; }
</style>
</head>
<body>
<h1>互動推論示範（純前端）</h1>
<p>模型參數直接沿用 Python 訓練出的權重與係數（見 <code>docs/model_params.json</code>）， 推論全部在瀏覽器完成， 不送任何請求。</p>

<section id="iris-form">
  <h2>Iris 鳶尾花分類</h2>
  <label>花萼長 sepal_length (cm)<input id="i-sepal-length" type="number" step="0.1" value="5.1"></label>
  <label>花萼寬 sepal_width (cm)<input id="i-sepal-width" type="number" step="0.1" value="3.5"></label>
  <label>花瓣長 petal_length (cm)<input id="i-petal-length" type="number" step="0.1" value="1.4"></label>
  <label>花瓣寬 petal_width (cm)<input id="i-petal-width" type="number" step="0.1" value="0.2"></label>
  <button id="i-run">預測</button>
</section>

<section id="ai4i-form">
  <h2>AI4I 2020 故障機率</h2>
  <label>空氣溫度 Air temperature (K)<input id="a-air" type="number" step="0.1" value="298.6"></label>
  <label>製程溫度 Process temperature (K)<input id="a-process" type="number" step="0.1" value="308.7"></label>
  <label>轉速 Rotational speed (rpm)<input id="a-rpm" type="number" value="1408"></label>
  <label>扭矩 Torque (Nm)<input id="a-torque" type="number" step="0.1" value="46.3"></label>
  <label>刀具磨耗 Tool wear (min)<input id="a-wear" type="number" value="0"></label>
  <label>產品等級 Product Type
    <select id="a-type">
      <option value="L" selected>L（低階）</option>
      <option value="M">M（中階）</option>
      <option value="H">H（高階）</option>
    </select>
  </label>
  <button id="a-run">預測</button>
</section>

<div id="result" class="result">
  <h2>預測結果</h2>
  <div id="result-pred" class="pred"></div>
  <div id="result-table"></div>
  <p id="result-note" class="muted"></p>
</div>

<script src="app.js"></script>
</body>
</html>
