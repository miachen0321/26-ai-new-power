<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris 與 AI4I｜前端互動推論</title>
<style>
  :root { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #17233b; background: #f3f6fb; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1080px; margin: auto; padding: 36px 20px 56px; }
  h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.6rem); }
  .intro { color: #516078; line-height: 1.7; margin-bottom: 26px; }
  a { color: #1765ba; }
  .back { margin-bottom: 22px; }
  .back a { text-decoration: none; font-weight: 600; }
  .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  section, #result { background: white; border: 1px solid #dbe3ef; border-radius: 16px; padding: 24px; box-shadow: 0 8px 28px #1739630d; }
  section { margin-bottom: 20px; min-height: 100%; }
  h2 { margin: 0 0 8px; font-size: 1.3rem; }
  .hint { margin: 0 0 18px; color: #59687e; font-size: .92rem; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  label { display: block; font-weight: 600; font-size: .9rem; }
  input, select { display: block; width: 100%; margin-top: 6px; padding: 10px 11px; border: 1px solid #acb9cc; border-radius: 8px; background: white; color: inherit; font: inherit; }
  input:focus, select:focus, button:focus { outline: 3px solid #8dbcf5; outline-offset: 2px; }
  button { margin-top: 20px; border: 0; border-radius: 9px; background: #1765ba; color: white; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #0e4f98; }
  #result { margin-top: 20px; min-height: 120px; }
  #result h2 { margin-bottom: 10px; }
  #result-pred { font-size: 1.25rem; font-weight: 700; color: #0e4f98; margin-bottom: 12px; }
  #result p { line-height: 1.65; }
  #result-note { color: #59687e; font-size: .85rem; margin-bottom: 0; }
  .probabilities { width: 100%; border-collapse: collapse; }
  .probabilities th, .probabilities td { padding: 8px; border-bottom: 1px solid #e5eaf2; text-align: left; font-variant-numeric: tabular-nums; }
  #result table { width: 100%; border-collapse: collapse; }
  #result td, #result th { padding: 8px; border-bottom: 1px solid #e5eaf2; text-align: left; }
  .bar-cell { display: block; width: 100%; height: 9px; min-width: 1px; background: #eef2f8; border-radius: 5px; overflow: hidden; margin-top: 4px; }
  .bar > span { display: block; height: 9px; border-radius: 5px; background: #3986d2; }
  .muted { color: #666; font-size: .88rem; }
  .footnote { color: #59687e; font-size: .85rem; margin-top: 26px; }
  @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="back"><a href="index.html">← 回分析首頁</a></div>
  <h1>互動推論實驗室</h1>
  <p class="intro">模型參數直接沿用 Python 訓練出的權重與係數（詳見 <code>docs/model_params.json</code>）；推論只在瀏覽器內完成，不會傳送輸入資料。兩個表單送出後，結果共用同一個顯示區。</p>

  <div class="forms">
    <section id="iris-form">
      <h2>Iris 鳶尾花分類</h2>
      <p class="hint">輸入四項量測值，單位為 cm。</p>
      <div class="fields">
        <label>花萼長度（cm）<input id="i-sepal-length" type="number" step="0.1" value="5.1"></label>
        <label>花萼寬度（cm）<input id="i-sepal-width" type="number" step="0.1" value="3.5"></label>
        <label>花瓣長度（cm）<input id="i-petal-length" type="number" step="0.1" value="1.4"></label>
        <label>花瓣寬度（cm）<input id="i-petal-width" type="number" step="0.1" value="0.2"></label>
      </div>
      <button id="i-run" type="button">預測 Iris 類別</button>
    </section>

    <section id="ai4i-form">
      <h2>AI4I 設備故障風險</h2>
      <p class="hint">輸入設備狀態；產品等級為 L、M 或 H。</p>
      <div class="fields">
        <label>空氣溫度（K）<input id="a-air" type="number" step="0.1" value="298.6"></label>
        <label>製程溫度（K）<input id="a-process" type="number" step="0.1" value="308.7"></label>
        <label>轉速（rpm）<input id="a-rpm" type="number" value="1408"></label>
        <label>扭矩（Nm）<input id="a-torque" type="number" step="0.1" value="46.3"></label>
        <label>刀具磨耗（min）<input id="a-wear" type="number" value="0"></label>
        <label>產品等級
          <select id="a-type">
            <option value="L" selected>L（低階）</option>
            <option value="M">M（中階）</option>
            <option value="H">H（高階）</option>
          </select>
        </label>
      </div>
      <button id="a-run" type="button">估計故障機率</button>
    </section>
  </div>

  <div id="result" style="display:none">
    <h2>推論結果</h2>
    <div id="result-pred"></div>
    <div id="result-table"></div>
    <p id="result-note" class="muted"></p>
  </div>

  <p class="footnote">兩個表單共用同一個結果區。AI4I 模型以 Logistic Regression 回推故障機率（門檻 50%），派生特徵（扭矩×轉速、溫度差）會自動補計。</p>
</main>
<script src="app.js"></script>
</body>
</html>
